# This is a GitHub Actions workflow file that defines a set of jobs to be run
# automatically on certain repository events.
#
# Filepath: .github/workflows/build.yml

name: C++ CI Build
on:
  push:
    branches: [ "main" ]
    # This makes the workflow run when you push a new tag like "v1.0.0"
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

# Cancels previous in-progress runs on the same branch to save resources.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This workflow contains a single job called "build"
  build:
    # We define the job name and matrix here at the top level.
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux-package
          - os: windows-latest
            artifact-name: windows-package

    # The type of runner that the job will run on, based on the matrix.os value
    runs-on: ${{ matrix.os }}

    steps:
    # 1. Check-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # We need to fetch submodules because some dependencies might use them.
        # It's good practice even if your direct dependencies don't.
        submodules: 'recursive'

    # 1.5. Read project version from file
    # This reads VERSION.txt and sets the version as an environment variable
    # for the rest of the job to use.
    - name: Read project version
      id: version
      run: echo "VERSION=$(cat VERSION.txt)" >> $GITHUB_ENV

    # 2. Install Linux-specific dependencies
    # This step is conditional and only runs on the ubuntu-latest runner.
    # It installs libraries required by GLFW for windowing and input.
    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo add-apt-repository universe
        sudo apt-get update
        sudo apt-get install -y libwayland-dev libxkbcommon-dev wayland-protocols xorg-dev

    # 2. Install the Vulkan SDK
    # This is the key step for handling Vulkan. This action downloads the SDK
    # and sets up the VULKAN_SDK environment variable, which your find_package()
    # command will then use. I've updated the version to a more common one.
    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        # The version of the Vulkan SDK to install.
        vulkan-query-version: 1.3.268.0
        # Components needed: Headers, Loader, SPIRV-Tools (a dependency for Glslang),
        # and finally Glslang itself for the shader compiler (glslangValidator).
        vulkan-components: Vulkan-Headers, Vulkan-Loader, SPIRV-Tools, Glslang
        # Cache the installed SDK to speed up subsequent runs.
        vulkan-use-cache: true

    # 3a. Set version for tagged builds
    # This step runs ONLY on tagged builds. It strips the 'v' from the tag
    # and exports the result as an environment variable for the next step.
    - name: Set version for tagged builds
      if: startsWith(github.ref, 'refs/tags/')
      run: echo "RELEASE_VERSION=${{ github.ref_name#refs/tags/v }}" >> $GITHUB_ENV
      shell: bash # Use bash for this simple, safe string manipulation

    # 3b. Configure CMake for a tagged release
    # This step runs ONLY on tagged builds and uses the version from the step above.
    - name: Configure CMake (Tag Build)
      if: startsWith(github.ref, 'refs/tags/')
      run: cmake -B build -S . -DPROJECT_VERSION=${{ env.RELEASE_VERSION }}

    # 3c. Configure CMake for a normal build
    # This step runs on all builds that are NOT tagged (e.g., push to main).
    - name: Configure CMake (Default Build)
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: cmake -B build -S .

    # 4. Build the project
    # This step runs the build command. The `--config Release` flag is important
    # for ensuring you are building an optimized version of your program.
    - name: Build with CMake
      run: cmake --build build --config Release

    # 5. Package the application using CPack
    # This step only runs if the workflow was triggered by a tag.
    - name: Package with CPack
      if: startsWith(github.ref, 'refs/tags/')
      working-directory: build
      run: cpack -C Release -B ${{ github.workspace }}/build/packages

    # 6. Upload the package as an artifact
    # This allows other jobs in the workflow to download and use the package.
    - name: Upload Build Artifact
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        # We construct the full path to the package file here, using the version
        # from the VERSION.txt file we read in a previous step.
        path: |
          ${{ github.workspace }}/build/packages/SimplyVoxels-${{ env.VERSION }}-Linux-x86_64.deb
          ${{ github.workspace }}/build/packages/SimplyVoxels-${{ env.VERSION }}-Windows-x64.zip
        retention-days: 5 # Keep artifacts for a few days

    # 5. (Optional) Run tests if you have any
    # If you add CTest tests to your project in the future, you can uncomment this.
    # - name: Run tests
    #   working-directory: build
    #   run: ctest -C Release
